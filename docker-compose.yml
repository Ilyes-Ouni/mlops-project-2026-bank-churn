services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bank-churn-api:local
    ports:
      - "8000:8000"
    environment:
      BANK_CHURN_MODEL_PATH: /app/models/model.joblib
    volumes:
      - ./models/model.joblib:/app/models/model.joblib:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
