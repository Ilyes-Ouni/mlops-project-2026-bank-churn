[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bank-churn"
version = "0.1.0"
description = "MLOps platform for bank customer churn prediction"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ilyes-Ouni", email = "ilyes.ouni700@gmail.com" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "mlflow>=2.16",
  "xgboost>=2.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
  "flake8>=7.1",
  "pre-commit>=3.8",
  "httpx>=0.27",
]

[tool.poetry]
packages = [{ include = "bank_churn", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.coverage.run]
source = ["bank_churn"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
